<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supply Chain Control Tower - Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
<div class="login-box">
    <div class="brand">
        <div class="brand-mark">📦</div>
        <div>
            <h1>SUPPLY CHAIN</h1>
            <span>CONTROL TOWER</span>
        </div>
    </div>
    <h2>Welcome Back</h2>
    <p class="muted">Sign in to your real-time operations dashboard</p>
    {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
    <form method="POST">
        <label>Username</label>
        <input name="username" value="admin" required>
        <label>Password</label>
        <input type="password" name="password" value="admin123" required>
        <button class="login-btn" type="submit">SIGN IN →</button>
    </form>
    <small>Demo login: admin / admin123</small>
</div>
</body>
</html>
